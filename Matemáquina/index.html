<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="main.css">
    <script defer src="main.js"></script>
</head>
<body>
    <div class="calc">
        <input type="text">
        <button class="bt_num bt_num_1">1</button>
        <button class="bt_num">2</button>
        <button class="bt_num">3</button>
        <button class="reset">C</button>
        <button class="bt_num">4</button>
        <button class="bt_num">5</button>
        <button class="bt_num">6</button>
        <button class="mais">+</button>
        <button class="bt_num">7</button>
        <button class="bt-num">8</button>
        <button class="bt_num">9</button>
        <button class="menos">-</button>
        <button class="ponto">.</button>
        <button class="bt_num">0</button>
        <button class="div">/</button>
        <button class="vezes">*</button>
        <button class="igual">=</button>
    </div>
</body>
</html>
